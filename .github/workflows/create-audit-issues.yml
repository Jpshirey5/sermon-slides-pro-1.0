name: Create audit issues

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Create issues from backlog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKLOG: ${{ secrets.CODEX_ISSUE_BACKLOG }}
          REPO: ${{ github.repository }}
        run: |
          python <<'PY'
          import os
          import subprocess

          backlog = os.environ["BACKLOG"]
          repo = os.environ["REPO"]

          chunks = backlog.split("TITLE:")
          created = []

          for chunk in chunks:
              chunk = chunk.strip()
              if not chunk:
                  continue

              if "BODY:" not in chunk:
                  print(f"Skipping malformed block:\n{chunk[:300]}\n")
                  continue

              title_part, body_part = chunk.split("BODY:", 1)
              title = title_part.strip()
              body = body_part.strip()

              if not title or not body:
                  print(f"Skipping incomplete block:\n{chunk[:300]}\n")
                  continue

              print(f"Creating issue: {title}")

              result = subprocess.run(
                  [
                      "gh", "issue", "create",
                      "--repo", repo,
                      "--title", title,
                      "--body", body,
                  ],
                  capture_output=True,
                  text=True,
              )

              print(result.stdout)
              print(result.stderr)

              if result.returncode == 0:
                  created.append(title)
              else:
                  print(f"Failed to create: {title}")

          print("\nCreated issues:")
          for title in created:
              print(f"- {title}")

          print(f"\nTotal created: {len(created)}")
          PY
